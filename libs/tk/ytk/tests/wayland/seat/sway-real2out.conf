# Two outputs like the real layout of the user (trace of 2026-10-31): a laptop panel at
# fractional scale 1.5 on the left, a bigger output at scale 1 to its right and 70 px higher.
# Sway reports the integer scale 2 in wl_output.scale for the fractional output.  The client
# binds the panel first, so a new surface starts at scale 2 and flips to 1 on the other
# output.  Windows open on the scale 1 output (workspace 1 lives there).  Config of the
# separate headless sway of the seat harness (not the login session's sway).
#   HEADLESS-2  2240x1400 at scale 1.5 = 1493x933 logical, at 0,70  (the client binds it first)
#   HEADLESS-1  2560x1440 at scale 1, at 1493,0
# harness-outputs: 2
# harness-layout: 4053 1440
# harness-edge-output: 1493 0 4053 1440

output HEADLESS-2 mode --custom 2240x1400 scale 1.5 pos 0 70
output HEADLESS-1 mode --custom 2560x1440 scale 1 pos 1493 0
workspace 1 output HEADLESS-1
workspace 2 output HEADLESS-2
default_border none
default_floating_border none
focus_follows_mouse no
for_window [title="^T0\.[0-9]+"] floating enable, move position 100 100
for_window [app_id="^[Tt]0_"] floating enable, move position 100 100
exec_always swaymsg workspace 1
seat seat0 fallback true
seat seat0 hide_cursor 0
bar {
    mode invisible
}
