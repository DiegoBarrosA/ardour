# Two outputs like the real layout of the user: a portrait output at scale 1.25 on the left and a
# bigger output at scale 1 to its right and 40 px lower.  Config of the separate headless sway of the
# seat harness (not the login session's sway).
#   HEADLESS-2  864x1536 logical (1080x1920 at scale 1.25) at 0,0 (the client binds it first)
#   HEADLESS-1  2560x1440 at 864,40
# harness-outputs: 2
# harness-layout: 3424 1536
# harness-edge-output: 864 40 3424 1480

output HEADLESS-2 mode --custom 1080x1920 scale 1.25 pos 0 0
output HEADLESS-1 mode --custom 2560x1440 scale 1 pos 864 40
default_border none
default_floating_border none
focus_follows_mouse no
for_window [title="^T0\.[0-9]+"] floating enable, move position 100 100
for_window [app_id="^[Tt]0_"] floating enable, move position 100 100
seat seat0 fallback true
seat seat0 hide_cursor 0
bar {
    mode invisible
}
