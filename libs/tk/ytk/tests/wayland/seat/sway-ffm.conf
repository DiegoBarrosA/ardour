# Variant with focus_follows_mouse yes (the sway default).  Config of the separate headless sway of the seat harness (not the login session's sway).
# One 1920x1080 output.  Test windows float at 100,100.  Other windows (Ardour) stay
# tiled, so a big window fills the output like it does in a normal session.
output HEADLESS-1 mode 1920x1080 pos 0 0
default_border none
default_floating_border none
focus_follows_mouse yes
for_window [title="^T0\.[0-9]+"] floating enable, move position 100 100
for_window [app_id="^[Tt]0_"] floating enable, move position 100 100
seat seat0 fallback true
seat seat0 hide_cursor 0
bar {
    mode invisible
}
